[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cytario_cli"]

[project]
name = "cytario-cli"
version = "0.1.0"
description = "CLI for working with Cytario storage connections as the signed-in user (browser OIDC sign-in, AWS CLI profile setup, token refresh)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cytario" },
]
keywords = [
  "cytario",
  "oidc",
  "aws",
  "sts",
  "web-identity",
  "ai-agent",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/cytario/cytario-cli"
Repository = "https://github.com/cytario/cytario-cli"
Issues = "https://github.com/cytario/cytario-cli/issues"
Changelog = "https://github.com/cytario/cytario-cli/releases"

[project.scripts]
cytario = "cytario_cli.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
  "python-semantic-release>=10",
]

# python-semantic-release — same no-commit mode as cytario-app-sdk: the
# version step stamps the working tree, pushes only the tag, and the
# GitHub Release carries the notes; PyPI publishing is trusted-publishing
# (OIDC) in the separate publish job.
[tool.semantic_release]
commit_parser = "conventional"
version_variables = ["src/cytario_cli/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
build_command = "uv build"
commit_author = "github-actions <actions@users.noreply.github.com>"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release."
publish_to_pypi = false
upload_to_vcs_release = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # trailing-comma rule conflicts with the formatter
  "ISC001",  # implicit-string-concat conflicts with the formatter
  "D203",    # one-blank-line-before-class (conflicts with D211)
  "D213",    # multi-line-summary-second-line (conflicts with D212)
  "FBT001",  # boolean-typed positional/keyword args are idiomatic Typer flags
  "FBT002",
  "FBT003",
  "CPY001",  # no copyright-notice convention in sibling Cytario repos
  "TRY003",  # long messages in raise are the actionable error text here
  "EM101",   # string-literal raise messages are fine for this size of CLI
  "EM102",   # f-string raise messages likewise
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",    # asserts are the point of a test suite
  "S105",    # "hardcoded password" strings are test fixtures
  "S106",    # same, as a function argument
  "S107",    # same, as a function default arg
  "S108",    # /tmp paths in profile-writer tests are placeholder paths
  "D",       # docstrings not required on every test function
  "ANN",     # type annotations not required in tests
  "ARG001",  # side-effecting fixtures are requested but not read
  "PLC0415", # importing the module under monkeypatch inside the test is the point
  "PLR2004", # magic values are fine in test assertions
]

[tool.pytest.ini_options]
testpaths = ["tests"]
